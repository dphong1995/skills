[package]
name = "claude-sessions"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ClaudeSessions"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "gui"
harness = false

[features]
# The gate app shows the core fixture states; release builds leave it out.
fixtures = ["claude-sessions-core/fixtures"]

[dependencies]
claude-sessions-core.workspace = true
claude-sessions-macos.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
claude-sessions-core = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
