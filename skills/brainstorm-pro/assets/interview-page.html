<!doctype html>
<html lang="vi" class="bg-page scroll-pt-14">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phỏng vấn thiết kế</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
<style>
/* Layout: sticky bar with the topic and a jump link per question; settled decisions fold at the top; one card per question with everything to read first (why, context, options side by side, recommendation) and a compact answer strip last; a small floating bar picks the recommendations and sends or copies every answer at once.
   Document mode (a Markdown file): the same bar with the section links, one card per ## section, a note per ## and ### heading and per selected passage in review mode, and a bar that approves or sends the notes.
   Parts are daisyUI components (navbar, card, badge, alert, table, collapse, btn, textarea, modal, toast, kbd) placed with Tailwind utilities. The theme is the page's own colors, light and dark following the system; muted text, the page background, the chosen-option tint and the code line tints have no daisyUI name and are tokens of their own. */
:root {
  --color-base-100: #ffffff;
  --color-base-200: #edf0f5;
  --color-base-300: #d8dee8;
  --color-base-content: #172031;
  --color-primary: #2b4fbf;
  --color-primary-content: #ffffff;
  --color-info: #2b4fbf;
  --color-info-content: #ffffff;
  --color-success: #1d7348;
  --color-success-content: #ffffff;
  --color-warning: #845400;
  --color-warning-content: #ffffff;
  --color-error: #a93838;
  --color-error-content: #ffffff;
  --page: #f3f5f8;
  --muted: #5b6678;
  --tint: #e7ecfa;
  --mark: rgb(255 200 0 / .22);
  --add: rgb(26 127 55 / .14);
  --del: rgb(207 34 46 / .12);
  --hl: rgb(255 200 0 / .35);
  --hl-active: rgb(255 170 0 / .65);
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-base-100: #151c27; --color-base-200: #1b2330; --color-base-300: #2a3445; --color-base-content: #e5eaf2;
    --color-primary: #93aaff; --color-primary-content: #0e131b; --color-info: #93aaff; --color-info-content: #0e131b;
    --color-success: #74d3a0; --color-success-content: #0e131b; --color-warning: #e8bb5f; --color-warning-content: #0e131b;
    --color-error: #f08d8d; --color-error-content: #0e131b;
    --page: #0e131b; --muted: #9ba7b9; --tint: #1c2747; --mark: rgb(255 200 0 / .14); --add: rgb(46 160 67 / .2); --del: rgb(248 81 73 / .18);
    --hl: rgb(255 200 0 / .22); --hl-active: rgb(255 190 0 / .45);
    color-scheme: dark;
  }
}
</style>
<style type="text/tailwindcss">
@theme inline {
  --color-page: var(--page);
  --color-muted: var(--muted);
  --color-tint: var(--tint);
  --color-mark: var(--mark);
  --color-add: var(--add);
  --color-del: var(--del);
  --color-hl: var(--hl);
  --color-hl-active: var(--hl-active);
  --font-sans: var(--font-body);
  --font-mono: var(--font-code);
}
</style>
</head>
<body class="bg-page text-base-content font-sans text-[14px] leading-normal">
<header class="sticky top-0 z-5 bg-base-100 border-b border-base-300">
  <div class="navbar min-h-0 max-w-[1312px] mx-auto px-4 py-2 flex-wrap justify-between gap-x-3 gap-y-1.5">
    <h1 class="text-[15px] font-semibold leading-[1.35] min-w-0" id="topic">Phỏng vấn thiết kế</h1>
    <nav class="flex flex-wrap gap-1" id="qnav" aria-label="Các câu hỏi"></nav>
  </div>
</header>
<main class="max-w-[1312px] mx-auto px-4 pt-3.5 pb-20 grid gap-3.5" id="main"></main>

<script>
(() => {
  const D = /*__INTERVIEW_DATA__*/null;
  const $ = (s, root = document) => root.querySelector(s);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
    return n;
  };
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Class sets used in more than one place. daisyUI's color classes take no Tailwind variant, so a variant reads the color variable instead.
  const FOCUS = 'focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-primary)]';
  const CODE = 'font-mono text-[.86em] bg-base-200 rounded px-[.3em] py-[.05em] wrap-anywhere';
  // daisyUI centers a figure inside a card as a flex box, so each figure sets its own display.
  const FIG = 'm-0 min-w-0 overflow-hidden border border-base-300 rounded-box';
  const CAPTION = 'flex items-center justify-between gap-2 min-h-7 py-0.5 pr-1 pl-2.5 border-b border-base-300 font-mono text-[11px] text-muted';
  const CAP_TEXT = 'min-w-0 wrap-anywhere';
  // daisyUI lays an alert's children out as columns; `block` keeps its text flowing as one paragraph.
  const CALLOUT = 'alert alert-soft alert-warning block text-base-content text-[14px] leading-normal px-3 py-1.5';
  const LIST = 'm-0 pl-[1.3em] grid gap-0.5';
  const PC = 'pl-[1.1em] -indent-[1.1em] before:inline-block before:w-[1.1em] before:indent-0 before:font-bold';
  const TEXTAREA = 'textarea w-full min-h-0 resize-y text-[13px] leading-normal px-2.5 py-[5px]';
  const btnCls = (kind, small) => ['btn', small ? 'btn-xs' : 'btn-sm',
    kind === 'primary' ? 'btn-primary' : kind === 'file' ? 'btn-soft btn-primary whitespace-nowrap' : ''].join(' ');
  const KEY_HINT = /Mac|iP/.test(navigator.platform) ? '⌘ Enter' : 'Ctrl Enter';

  // Inline `code` and **bold** only; everything else is plain text. A `path:N-M` the render script found on disk opens in the file viewer.
  const PATH = /^(.+?)(?::(\d+)(?:-(\d+))?)?$/;
  const codeSpan = (t) => {
    const m = PATH.exec(t);
    const abs = D && D.paths && D.paths[m[1]];
    return abs
      ? el('a', { href: '#', class: CODE + ' link link-primary decoration-dotted underline-offset-2 hover:decoration-solid', title: 'Xem file',
        onclick: (e) => { e.preventDefault(); openFile(abs, extLang(abs), m[2] ? [+m[2], +(m[3] || m[2])] : null); } }, t)
      : el('code', { class: CODE, text: t });
  };
  const inline = (text) => {
    const frag = document.createDocumentFragment();
    String(text ?? '').split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach((part) => {
      if (!part) return;
      if (part.length > 2 && part[0] === '`' && part.endsWith('`')) frag.append(codeSpan(part.slice(1, -1)));
      else if (part.length > 4 && part.startsWith('**') && part.endsWith('**')) frag.append(el('strong', { text: part.slice(2, -2) }));
      else frag.append(document.createTextNode(part));
    });
    return frag;
  };
  // The same text without the markup, for a label drawn by CSS.
  const plain = (text) => String(text ?? '').replace(/`|\*\*/g, '');

  // Code: highlight.js from the CDN (plain text when it did not load), one block per line so lines can be numbered and tinted.
  const LH = 19, PAD = 8;
  const AUTO = ['typescript', 'javascript', 'json', 'sql', 'bash', 'python', 'css', 'scss', 'xml', 'yaml'];
  const TINT = { mark: 'bg-mark', add: 'bg-add', del: 'bg-del', pad: 'bg-[repeating-linear-gradient(135deg,transparent_0_5px,var(--color-base-300)_5px_6px)]' };
  const highlight = (text, lang) => {
    const h = window.hljs;
    if (!h) return null;
    try {
      if (lang && h.getLanguage(lang)) return h.highlight(text, { language: lang, ignoreIllegals: true }).value;
      const auto = h.highlightAuto(text, AUTO);
      return auto.relevance >= 5 ? auto.value : null;
    } catch (e) { return null; }
  };
  // Splits highlighted HTML into lines, closing the spans still open at each line end and reopening them on the next line.
  const splitLines = (html) => {
    const lines = [];
    let open = [], cur = '';
    for (const part of html.split(/(<span[^>]*>|<\/span>|\n)/)) {
      if (!part) continue;
      if (part === '\n') { lines.push(cur + '</span>'.repeat(open.length)); cur = open.join(''); }
      else if (part.startsWith('<span')) { open.push(part); cur += part; }
      else if (part === '</span>') { open.pop(); cur += part; }
      else cur += part;
    }
    lines.push(cur + '</span>'.repeat(open.length));
    return lines;
  };
  const hlLines = (text, lang) => {
    const html = highlight(text, lang);
    return html == null ? text.split('\n').map(esc) : splitLines(html);
  };
  const linesView = (lines, nums, cls) => {
    const row = (html, i, px) => '<span class="block min-h-[19px] ' + px + (cls && cls[i] ? ' ' + TINT[cls[i]] : '') + '">' + html + '</span>';
    const PRE = 'm-0 py-2 font-mono text-[12.5px] leading-[19px] [tab-size:2]';
    const src = el('pre', { class: PRE + ' flex-[1_0_auto]' });
    src.innerHTML = '<code class="block">' + lines.map((l, i) => row(l, i, 'px-2.5')).join('') + '</code>';
    let gutter = null;
    if (nums) {
      gutter = el('pre', { class: PRE + ' flex-none sticky left-0 z-1 text-right text-muted bg-base-200 border-r border-base-300 select-none', 'aria-hidden': 'true' });
      gutter.innerHTML = nums.map((n, i) => row(n == null ? '' : String(n), i, 'px-2')).join('');
    }
    return el('div', { class: 'flex items-start overflow-x-auto' }, gutter, src);
  };
  const extLang = (file) => (/\.([\w-]+)$/.exec(file || '') || [])[1];

  // One modal shows a whole file, an image or a mockup at full size; Esc, the backdrop or Đóng closes it.
  const viewerTitle = el('span', { class: 'flex-1 min-w-0 font-mono text-[12px] wrap-anywhere' });
  const viewerBody = el('div', { class: 'grid min-h-0' });
  const viewer = el('dialog', { class: 'modal' },
    el('div', { class: 'modal-box p-0 w-[min(1400px,calc(100vw-32px))] max-w-none h-[calc(100vh-48px)] max-h-none bg-base-200 border border-base-300 grid grid-rows-[auto_minmax(0,1fr)] overflow-hidden' },
      el('div', { class: 'flex items-center gap-3 py-1.5 pr-1.5 pl-3.5 bg-base-100 border-b border-base-300' }, viewerTitle,
        el('form', { method: 'dialog' }, el('button', { class: btnCls() }, 'Đóng', el('kbd', { class: 'kbd kbd-xs', text: 'Esc' })))),
      viewerBody),
    el('form', { method: 'dialog', class: 'modal-backdrop' }, el('button', { text: 'Đóng' })));
  document.body.append(viewer);
  const showInViewer = (title, node) => {
    viewerTitle.textContent = title;
    viewerBody.replaceChildren(node);
    viewer.showModal();
  };
  const openFile = (file, lang, mark) => {
    const text = D.files[file].replace(/\n$/, '');
    const lines = hlLines(text, lang);
    const view = linesView(lines, lines.map((_, i) => i + 1), mark ? lines.map((_, i) => (i + 1 >= mark[0] && i + 1 <= mark[1] ? 'mark' : null)) : null);
    view.classList.add('overflow-auto', 'min-h-0');
    showInViewer(file + ' · ' + lines.length + ' dòng', view);
    view.scrollTop = mark ? Math.max(0, PAD + (mark[0] - 5) * LH) : 0;
  };
  const fileButton = (s, lang) => (s.file && D.files && D.files[s.file] != null
    ? el('button', { type: 'button', class: btnCls('file', true), onclick: () => openFile(s.file, lang, s.lines) }, 'Xem toàn file') : null);
  const zoomButton = (onclick) => el('button', { type: 'button', class: btnCls('file', true), onclick }, 'Phóng to');

  const codeBlock = (b) => {
    const lang = b.lang || extLang(b.file);
    const btn = fileButton(b, lang);
    const lines = hlLines(b.text || '', lang);
    return el('figure', { class: FIG + ' block bg-base-200' },
      b.label || btn ? el('figcaption', { class: CAPTION }, el('span', { class: CAP_TEXT, text: b.label || '' }), btn) : null,
      linesView(lines, b.lines ? lines.map((_, i) => b.lines[0] + i) : null, null));
  };

  // Before/after: rows line up on the longest common run of lines; removed and added lines are tinted, gaps hatched.
  const alignRows = (a, b) => {
    const n = a.length, m = b.length;
    const A = a.map((s) => s.trimEnd()), B = b.map((s) => s.trimEnd());
    const rows = [];
    if (n * m > 4e6) {
      for (let k = 0; k < Math.max(n, m); k++) rows.push({ a: k < n ? k : null, b: k < m ? k : null, same: A[k] === B[k] });
      return rows;
    }
    const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0, dels = [], adds = [];
    const flush = () => {
      for (let k = 0; k < Math.max(dels.length, adds.length); k++) rows.push({ a: dels[k] ?? null, b: adds[k] ?? null, same: false });
      dels = []; adds = [];
    };
    while (i < n || j < m) {
      if (i < n && j < m && A[i] === B[j]) { flush(); rows.push({ a: i++, b: j++, same: true }); }
      else if (j >= m || (i < n && dp[i + 1][j] >= dp[i][j + 1])) dels.push(i++);
      else adds.push(j++);
    }
    flush();
    return rows;
  };
  const diffBlock = (b) => {
    const sides = [b.before || {}, b.after || {}];
    const texts = sides.map((s) => s.text || '');
    const rows = alignRows(texts[0].split('\n'), texts[1].split('\n'));
    const cols = sides.map((s, k) => {
      const lang = s.lang || b.lang || extLang(s.file);
      const hl = hlLines(texts[k], lang);
      const key = k ? 'b' : 'a';
      return el('div', { class: 'min-w-0' + (k ? ' border-l border-base-300 max-[720px]:border-l-0 max-[720px]:border-t' : '') },
        el('div', { class: CAPTION }, el('span', { class: CAP_TEXT, text: (k ? 'Sau' : 'Trước') + (s.label ? ' · ' + s.label : '') }), fileButton(s, lang)),
        linesView(rows.map((r) => (r[key] == null ? '' : hl[r[key]])),
          s.lines ? rows.map((r) => (r[key] == null ? null : s.lines[0] + r[key])) : null,
          rows.map((r) => (r[key] == null ? 'pad' : r.same ? null : k ? 'add' : 'del'))));
    });
    return el('figure', { class: FIG + ' block bg-base-200' }, b.label ? el('figcaption', { class: CAPTION }, el('span', { class: CAP_TEXT, text: b.label })) : null,
      el('div', { class: 'grid grid-cols-2 max-[720px]:grid-cols-1' }, cols));
  };

  // Diagrams: Mermaid loads from the CDN only when the page has one; until it draws (or when it cannot) the source shows as text.
  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = el('script', { src });
    s.onload = resolve;
    s.onerror = reject;
    document.head.append(s);
  });
  let mermaidLoad = null;
  let mermaidQueue = Promise.resolve();
  let diagrams = 0;
  const loadMermaid = () => mermaidLoad || (mermaidLoad = loadScript('https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js').then(() => {
    window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', fontFamily: 'Be Vietnam Pro, system-ui, sans-serif',
      theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
    return window.mermaid;
  }));
  const mermaidBlock = (b) => {
    const text = b.text || '';
    const body = el('div', { class: 'p-2.5 overflow-x-auto [&>svg]:mx-auto [&>svg]:max-w-full [&>svg]:h-auto' }, linesView(hlLines(text, 'plaintext'), null, null));
    const id = 'mmd-' + ++diagrams;
    mermaidQueue = mermaidQueue.then(loadMermaid)
      .then((m) => m.parse(text).then(() => m.render(id, text)))
      .then(({ svg }) => { body.innerHTML = svg; })
      .catch(() => {
        const left = document.getElementById('d' + id);
        if (left) left.remove();
        body.prepend(el('p', { class: CALLOUT + ' mb-2', text: 'Không vẽ được sơ đồ (mất mạng hoặc sai cú pháp Mermaid); bên dưới là mã nguồn.' }));
      });
    return el('figure', { class: FIG + ' block bg-base-100' }, b.label ? el('figcaption', { class: CAPTION }, el('span', { class: CAP_TEXT, text: b.label })) : null, body);
  };

  const imgBlock = (b) => {
    const title = b.label || b.file || 'Ảnh';
    const alt = b.alt || b.label || '';
    const open = () => showInViewer(title, el('div', { class: 'overflow-auto min-h-0 p-4' }, el('img', { src: b.src, alt, class: 'max-w-none mx-auto' })));
    return el('figure', { class: FIG + ' block bg-base-100' },
      el('figcaption', { class: CAPTION }, el('span', { class: CAP_TEXT, text: title }), zoomButton(open)),
      el('div', { class: 'p-2.5' }, el('img', { src: b.src, alt, class: 'block mx-auto max-w-full max-h-[480px] w-auto h-auto object-contain cursor-zoom-in', onclick: open })));
  };

  // Mockups: each one is its own sandboxed page with Tailwind and daisyUI's wireframe theme; it reports its height so the frame fits it.
  const MOCK_HEAD = '<!doctype html><html data-theme="wireframe"><head><meta charset="utf-8">'
    + '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.css">'
    + '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/themes.css">'
    + '<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"><\/script>'
    + '<style>body{margin:0;padding:8px;font-family:system-ui,sans-serif;font-size:14px}</style></head><body>';
  const MOCK_TAIL = '<script>new ResizeObserver(() => parent.postMessage({ mockH: Math.ceil(document.body.getBoundingClientRect().height) }, "*")).observe(document.body);<\/script></body></html>';
  addEventListener('message', (e) => {
    if (!e.data || typeof e.data.mockH !== 'number') return;
    for (const f of document.querySelectorAll('iframe[data-mock]')) if (f.contentWindow === e.source) f.style.height = Math.min(Math.max(e.data.mockH, 24), 4000) + 'px';
  });
  const mockFrame = (html) => {
    const f = el('iframe', { sandbox: 'allow-scripts', 'data-mock': '', title: 'Bản phác', class: 'block w-full h-20 border-0' });
    f.srcdoc = MOCK_HEAD + html + MOCK_TAIL;
    return f;
  };
  const mockBlock = (html, label) => {
    const title = label || 'Bản phác';
    // White below the frame too, so a mockup in a taller option row reads as one box.
    return el('figure', { class: FIG + ' bg-base-100 flex flex-col items-stretch justify-start' },
      el('figcaption', { class: CAPTION }, el('span', { class: CAP_TEXT, text: title }),
        zoomButton(() => showInViewer(title, el('div', { class: 'overflow-auto min-h-0 p-4' }, mockFrame(html))))),
      el('div', { class: 'flex-1 bg-white' }, mockFrame(html)));
  };

  const block = (b) => {
    switch (b && b.t) {
      case 'p': return el('p', { class: 'whitespace-pre-line' }, inline(b.text));
      case 'list': return el(b.ordered ? 'ol' : 'ul', { class: LIST + (b.ordered ? ' list-decimal' : ' list-disc') }, (b.items || []).map((i) => el('li', {}, inline(i))));
      case 'code': return codeBlock(b);
      case 'diff': return diffBlock(b);
      case 'mermaid': return mermaidBlock(b);
      case 'img': return b.src ? imgBlock(b) : null;
      case 'mockup': return mockBlock(b.html || '', b.label);
      case 'table': return el('div', { class: 'overflow-x-auto border border-base-300 rounded-box' },
        el('table', { class: 'table table-sm text-[13px] [&_thead]:whitespace-normal [&_th]:align-top [&_td]:align-top' },
          el('thead', {}, el('tr', { class: 'bg-base-200' }, (b.head || []).map((h) => el('th', { class: 'text-base-content' }, inline(h))))),
          el('tbody', {}, (b.rows || []).map((r) => el('tr', {}, r.map((c) => el('td', {}, inline(c))))))));
      case 'note': return el('div', { class: CALLOUT + ' whitespace-pre-line' }, el('strong', { class: 'text-warning', text: 'Lưu ý: ' }), inline(b.text));
      default: return b && b.text ? el('p', { class: 'whitespace-pre-line' }, inline(b.text)) : null;
    }
  };

  const CARD = 'card card-border border-base-300 bg-base-100 px-[18px] py-4 max-[520px]:px-3 max-[520px]:py-3.5 grid gap-3 min-w-0 transition-[border-color,box-shadow] duration-200 motion-reduce:transition-none [&.attention]:border-[var(--color-warning)] [&.attention]:[box-shadow:0_0_0_3px_color-mix(in_oklab,var(--color-warning)_22%,transparent)]';
  const main = $('#main');
  const fit = (ta) => {
    ta.style.height = 'auto';
    if (ta.value && ta.offsetParent) ta.style.height = ta.scrollHeight + 2 + 'px';
  };

  // The floating bar's message, copy fallback and drafts, used by both modes. Served by render-interview.mjs --serve, a page sends its text to Claude itself; opened as a file, it copies the text for pasting.
  const sendMode = !!(D && D.send);
  const fabMsg = el('p', { class: 'alert alert-soft block max-w-[24rem] text-[13px] leading-normal px-2.5 py-1.5 shadow-lg empty:hidden', role: 'status' });
  const out = el('textarea', { id: 'out', class: TEXTAREA + ' w-[min(26rem,calc(100vw-32px))] font-mono text-[12px] max-h-[40vh] bg-base-200', readonly: true, hidden: true, 'aria-label': 'Nội dung để dán vào Claude' });
  const say = (kind, ...parts) => {
    fabMsg.dataset.kind = kind || '';
    fabMsg.classList.toggle('alert-success', kind === 'ok');
    fabMsg.classList.toggle('alert-warning', kind === 'warn');
    fabMsg.replaceChildren(...parts);
  };
  const copyText = async (text) => {
    out.value = text;
    let ok = false;
    // writeText can wait forever for a permission the browser never asks for, so it gets two seconds.
    try { await Promise.race([navigator.clipboard.writeText(text), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 2000))]); ok = true; }
    catch (e) { out.hidden = false; out.focus(); out.select(); try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } }
    out.hidden = ok;
    return ok;
  };
  const postText = async (text) => {
    const r = await fetch(D.send, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  };
  // Drafts are kept in this browser per page file, so a reload or a closed tab loses nothing.
  const storage = (key) => ({
    get: () => { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } },
    set: (v) => { try { if (v) localStorage.setItem(key, JSON.stringify(v)); else localStorage.removeItem(key); } catch (e) { /* storage blocked */ } },
  });

  // Images pasted or dropped into a text box: the serve script saves each one and the text gets [Ảnh #N] at the caret. Only references still in the text are sent, as "Ảnh #N: <path>" lines.
  const images = new Map();
  const IMG_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
  const IMG_MAX = 20 * 1024 * 1024;
  const IMG_REF = /\[Ảnh #(\d+)\]/g;
  const imgRefs = (text) => [...new Set([...text.matchAll(IMG_REF)].map((m) => +m[1]))].filter((n) => images.has(n));
  const imgLines = (text) => imgRefs(text).map((n) => 'Ảnh #' + n + ': ' + images.get(n).path);
  // One thumbnail per reference in the linked boxes (a hidden box does not count, its text is not sent); × removes the reference from the text.
  const imageStrip = (tas) => {
    const strip = el('div', { class: 'flex flex-wrap gap-1.5 empty:hidden' });
    const thumb = (n) => {
      const { url } = images.get(n);
      const title = 'Ảnh #' + n;
      return el('figure', { class: 'relative m-0 grid justify-items-center gap-px' },
        el('img', { src: url, alt: title, title, class: 'block h-16 w-auto max-w-40 object-contain rounded-md border border-base-300 cursor-zoom-in', onclick: () => {
          showInViewer(title, el('div', { class: 'overflow-auto min-h-0 p-4' }, el('img', { src: url, alt: title, class: 'max-w-none mx-auto' })));
        } }),
        el('span', { class: 'font-mono text-[11px] text-muted', text: '#' + n }),
        el('button', { type: 'button', class: 'btn btn-circle btn-xs absolute -top-1.5 -right-1.5 size-5 min-h-0 p-0', 'aria-label': 'Bỏ ' + title, onclick: () => {
          for (const ta of tas) {
            if (!ta.value.includes('[' + title + ']')) continue;
            ta.value = ta.value.split('[' + title + ']').join('');
            ta.dispatchEvent(new Event('input', { bubbles: true }));
          }
        } }, '×'));
    };
    strip.refresh = () => {
      const ns = imgRefs(tas.map((ta) => (ta.hidden ? '' : ta.value)).join('\n'));
      if (strip.dataset.refs === ns.join()) return;
      strip.dataset.refs = ns.join();
      strip.replaceChildren(...ns.map(thumb));
    };
    for (const ta of tas) ta.addEventListener('input', strip.refresh);
    return strip;
  };
  const imageInput = (ta, strip) => {
    const take = async (files) => {
      for (const file of files) {
        if (!IMG_TYPES.includes(file.type)) { say('warn', 'Chỉ nhận ảnh PNG, JPEG, GIF, WebP.'); continue; }
        if (file.size > IMG_MAX) { say('warn', 'Ảnh quá 20 MB.'); continue; }
        try {
          const r = await fetch(D.upload, { method: 'POST', headers: { 'Content-Type': file.type }, body: file });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const { n, path, url } = await r.json();
          images.set(n, { path, url });
          ta.setRangeText('[Ảnh #' + n + ']', ta.selectionStart, ta.selectionEnd, 'end');
          ta.dispatchEvent(new Event('input', { bubbles: true }));
        } catch (e) { say('warn', 'Không lưu được ảnh (Claude không còn chờ trang này).'); }
      }
    };
    const handle = (e, files, always) => {
      if (!files.length) return;
      if (!(D && D.upload)) {
        if (always) e.preventDefault();
        say('warn', 'Trang mở dạng file nên không gửi được ảnh: dán ảnh thẳng vào terminal Claude.');
        return;
      }
      e.preventDefault();
      take(files);
    };
    ta.addEventListener('paste', (e) => handle(e, [...e.clipboardData.files].filter((f) => f.type.startsWith('image/')), false));
    ta.addEventListener('drop', (e) => handle(e, [...e.dataTransfer.files], true));
  };
  // A file dropped outside a text box would open over the page.
  const hasFiles = (e) => [...(e.dataTransfer ? e.dataTransfer.types : [])].includes('Files');
  document.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener('drop', (e) => {
    if (!hasFiles(e) || e.defaultPrevented) return;
    e.preventDefault();
    say('warn', 'Thả ảnh vào một ô nhập.');
  });

  // Document mode: a Markdown file (spec, design, plan, report) drawn with marked, one card per ## section. In review mode every ## and ### heading and every selected passage takes a note, and the bar approves or sends the notes.
  const docPage = (doc) => {
    const review = !!doc.review;
    const ch = doc.changes || {};
    const store = storage('doc-draft:' + location.pathname);
    const notes = [];
    const ids = new Map();
    const nav = $('#qnav');
    let md = null;

    document.title = (review ? 'Duyệt · ' : '') + doc.title;
    document.documentElement.classList.replace('scroll-pt-14', 'scroll-pt-24');
    $('#topic').textContent = doc.title;
    if (review) $('#topic').after(el('span', { class: 'badge badge-sm badge-warning badge-soft whitespace-nowrap', text: 'Chờ duyệt · lần ' + (ch.round || 1) }));
    nav.setAttribute('aria-label', 'Các mục');
    nav.className = 'flex gap-1 w-full overflow-x-auto pb-0.5';

    // Notes in document order, so comments on passages and section notes read top to bottom.
    const filled = () => notes.filter((n) => n.ta.value.trim())
      .sort((a, b) => (a.box.compareDocumentPosition(b.box) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1));
    const count = el('span', { class: 'font-mono text-[12px] text-muted whitespace-nowrap' });
    const update = () => {
      const n = filled();
      count.textContent = n.length + ' góp ý';
      for (const x of notes) if (x.btn) x.btn.textContent = x.ta.value.trim() ? 'Góp ý ✓' : 'Góp ý';
      store.set(n.length ? { n: Object.fromEntries(n.filter((x) => !x.hl).map((x) => [x.key, x.ta.value])),
        h: n.filter((x) => x.hl).map((x) => ({ s: x.hl.s, e: x.hl.e, q: x.hl.text, t: x.ta.value })), img: Object.fromEntries(images) } : null);
      say('');
    };
    const noteBox = (key, placeholder) => {
      const ta = el('textarea', { rows: '2', class: TEXTAREA, placeholder, 'aria-label': 'Góp ý: ' + key });
      ta.addEventListener('input', () => { fit(ta); update(); });
      const strip = imageStrip([ta]);
      imageInput(ta, strip);
      const n = { key, ta, strip, box: el('div', { class: 'grid gap-1.5', 'data-note': '' }, ta, strip), btn: null };
      notes.push(n);
      return n;
    };
    const noteFor = (key) => {
      const n = noteBox(key, 'Góp ý cho mục này…');
      n.box.hidden = true;
      n.btn = el('button', { type: 'button', class: btnCls('', true) + ' btn-ghost text-muted font-normal', onclick: () => {
        if (n.box.hidden) { n.box.hidden = false; n.ta.focus(); }
        else if (!n.ta.value.trim()) n.box.hidden = true;
        else n.ta.focus();
      } }, 'Góp ý');
      return n;
    };
    const changeBadge = (key) => ((ch.changed || []).includes(key) ? el('span', { class: 'badge badge-xs badge-warning badge-soft', text: 'Đã sửa' })
      : (ch.added || []).includes(key) ? el('span', { class: 'badge badge-xs badge-success badge-soft', text: 'Mới' }) : null);

    // marked's HTML gets the page's classes; file paths and links to embedded files open in the viewer, other relative links are dropped.
    const decorate = (root) => {
      for (const a of root.querySelectorAll('a')) {
        const href = a.getAttribute('href') || '';
        const abs = D.links && D.links[href];
        a.className = 'link link-primary';
        if (abs) a.addEventListener('click', (e) => { e.preventDefault(); openFile(abs, extLang(abs)); });
        else if (/^(https?:|mailto:)/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
        else if (!href.startsWith('#')) a.removeAttribute('href');
      }
      for (const c of root.querySelectorAll('code')) if (!c.closest('pre')) c.replaceWith(codeSpan(c.textContent));
      for (const p of root.querySelectorAll('pre')) {
        const c = p.querySelector('code') || p;
        const lang = (/language-([\w-]+)/.exec(c.className) || [])[1];
        p.replaceWith(lang === 'mermaid' ? mermaidBlock({ text: c.textContent }) : codeBlock({ text: c.textContent.replace(/\n$/, ''), lang }));
      }
      for (const l of root.querySelectorAll('ul, ol')) {
        l.className = LIST + (l.tagName === 'OL' ? ' list-decimal' : l.querySelector(':scope > li > input[type=checkbox]') ? ' list-none pl-0' : ' list-disc');
      }
      for (const i of root.querySelectorAll('li > input[type=checkbox]')) i.className = 'checkbox checkbox-xs align-[-2px] me-1.5 disabled:opacity-100 disabled:cursor-default';
      for (const b of root.querySelectorAll('blockquote')) b.className = 'border-l-[3px] border-base-300 pl-3 text-muted';
      for (const h of root.querySelectorAll('hr')) h.className = 'border-base-300';
      for (const t of root.querySelectorAll('table')) {
        t.className = 'table table-sm text-[13px] [&_thead]:whitespace-normal [&_th]:align-top [&_td]:align-top';
        for (const r of t.querySelectorAll('thead tr')) r.className = 'bg-base-200';
        for (const c of t.querySelectorAll('th')) c.classList.add('text-base-content');
        const wrap = el('div', { class: 'overflow-x-auto border border-base-300 rounded-box' });
        t.replaceWith(wrap);
        wrap.append(t);
      }
    };

    // A ## or ### heading, keyed as "Section" or "Section › Subsection" (the render script compares rounds with the same keys).
    let h2key = '';
    let secKey = 'Mở đầu';
    let secs = 0;
    const heading = (t) => {
      const text = plain(t.text);
      const key = t.depth === 2 ? (h2key = text) : t.depth === 3 && h2key ? h2key + ' › ' + text : text;
      if (t.depth <= 3) secKey = key;
      const id = 'sec-' + ++secs;
      ids.set(key, id);
      const h = el(t.depth === 2 ? 'h2' : t.depth === 3 ? 'h3' : 'h4', { id,
        class: t.depth === 2 ? 'text-[18px] leading-[1.35] font-bold' : t.depth === 3 ? 'text-[15.5px] leading-[1.35] font-semibold' : 'text-[14px] font-semibold' });
      h.innerHTML = md.parseInline(t.text);
      decorate(h);
      if (t.depth > 3) return [h];
      const n = review ? noteFor(key) : null;
      return [el('div', { class: 'flex flex-wrap items-center gap-x-2 gap-y-1' }, h, changeBadge(key), n && n.btn), n && n.box].filter(Boolean);
    };

    // Each block carries its section key (data-k) and its lines in the .md (data-l, "from-to"), found from marked's token text; bullets and table rows get their own lines.
    const src = doc.md.replace(/\r\n?/g, '\n');
    let lineAt = 0, line = 1;
    const lineOf = (i) => { for (; lineAt < i; lineAt++) if (src[lineAt] === '\n') line++; return line; };
    const span = (raw, i) => { const a = lineOf(i); return a + '-' + (a + raw.replace(/\n+$/, '').split('\n').length - 1); };
    const tag = (node, lines) => { node.dataset.k = secKey; if (lines) node.dataset.l = lines; return node; };

    const render = (marked) => {
      md = new marked.Marked({ gfm: true, renderer: { html: ({ text }) => esc(text) } });
      let card = null;
      let titled = false;
      let pos = 0;
      for (const t of md.lexer(src)) {
        const i = src.indexOf(t.raw, pos);
        if (i >= 0) pos = i + t.raw.length;
        if (t.type === 'space') continue;
        const lines = i < 0 ? null : span(t.raw, i);
        if (t.type === 'heading' && t.depth === 1 && !titled) { titled = true; continue; }
        if (!card || (t.type === 'heading' && t.depth === 2)) {
          card = el('article', { class: CARD });
          main.append(card);
          if (t.type === 'heading' && t.depth === 2) {
            const [row, ...rest] = heading(t);
            card.append(tag(row, lines), ...rest);
            nav.append(el('a', { href: '#' + ids.get(h2key), class: 'btn btn-xs btn-ghost font-normal whitespace-nowrap', text: h2key }));
            continue;
          }
        }
        if (t.type === 'heading') {
          const [row, ...rest] = heading(t);
          card.append(tag(row, lines), ...rest);
        }
        else if (t.type === 'code') {
          const lang = (t.lang || '').split(/\s/)[0] || undefined;
          const fig = lang === 'mermaid' ? mermaidBlock({ text: t.text }) : codeBlock({ text: t.text, lang });
          if (lang === 'mermaid') fig.dataset.mmd = '';
          card.append(tag(fig, lines));
        }
        else {
          const box = tag(el('div', { class: 'grid gap-1.5 min-w-0' }), lines);
          box.innerHTML = md.parser([t]);
          if (t.type === 'list' && i >= 0) {
            const items = box.querySelectorAll(':scope > ul > li, :scope > ol > li');
            let p = i;
            t.items.forEach((it, k) => {
              const j = src.indexOf(it.raw, p);
              if (j < 0 || !items[k]) return;
              p = j + it.raw.length;
              tag(items[k], span(it.raw, j));
            });
          }
          if (t.type === 'table' && lines) {
            const a = +lines.split('-')[0];
            box.querySelectorAll('thead tr').forEach((r) => tag(r, a + '-' + a));
            box.querySelectorAll('tbody tr').forEach((r, k) => tag(r, (a + 2 + k) + '-' + (a + 2 + k)));
          }
          decorate(box);
          card.append(box);
        }
      }
    };

    // Comments on a selected passage: the passage gets a mark and a note opens under it. Offsets count the text a passage can be selected in, so a draft marks the same passage again after a reload.
    const SKIP = 'textarea, input, button, svg, [data-note], [data-mmd]';
    const MARK = 'bg-hl text-inherit rounded-[2px] cursor-pointer data-[active=true]:bg-hl-active';
    const selectable = (t) => !t.parentElement.closest(SKIP) && !!t.parentElement.closest('#main > article');
    const walk = () => document.createTreeWalker(main, NodeFilter.SHOW_TEXT,
      { acceptNode: (t) => (t.parentElement.closest(SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
    const allText = () => { let s = ''; for (let w = walk(), t; (t = w.nextNode());) s += t.data; return s; };
    const offsetOf = (node, k) => { let o = 0; for (let w = walk(), t; (t = w.nextNode());) { if (t === node) return o + k; o += t.length; } return -1; };
    const rangeAt = (s, e) => {
      const r = document.createRange();
      let o = 0, started = false;
      for (let w = walk(), t; (t = w.nextNode());) {
        if (!started && s < o + t.length) { r.setStart(t, s - o); started = true; }
        if (started && e <= o + t.length) { r.setEnd(t, e - o); return r; }
        o += t.length;
      }
      return null;
    };
    // The selected, non-blank part of each text node in the range that a comment can mark.
    const selectedTexts = (r) => {
      const root = r.commonAncestorContainer;
      const all = [];
      if (root.nodeType === 3) all.push(root);
      else for (let w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), t; (t = w.nextNode());) if (r.intersectsNode(t)) all.push(t);
      return all.filter(selectable).map((t) => ({ t, s: t === r.startContainer ? r.startOffset : 0, e: t === r.endContainer ? r.endOffset : t.length }))
        .filter((x) => x.t.data.slice(x.s, x.e).trim());
    };
    const short = (q) => {
      q = q.replace(/\s+/g, ' ').trim();
      return q.length <= 100 ? q : q.slice(0, 60).replace(/\s+\S*$/, '') + ' … ' + q.slice(-30).replace(/^\S*\s+/, '');
    };
    // The passage as read: a space where it crosses from one block, cell or code line to the next.
    const FLOW = 'p, li, td, th, h1, h2, h3, h4, h5, h6, blockquote, span.block, div';
    const quoteOf = (parts) => parts.map((p, k) => (k && p.parentElement.closest(FLOW) !== parts[k - 1].parentElement.closest(FLOW) ? ' ' : '') + p.data).join('');
    let hls = 0;
    const addComment = (r, text) => {
      const id = String(++hls);
      const parts = selectedTexts(r).map(({ t, s, e }) => {
        if (e < t.length) t.splitText(e);
        const part = s ? t.splitText(s) : t;
        const m = el('mark', { 'data-c': id, class: MARK });
        part.replaceWith(m);
        m.append(part);
        return part;
      });
      if (!parts.length) return null;
      const first = parts[0].parentElement, last = parts[parts.length - 1].parentElement;
      const s = offsetOf(parts[0], 0), e = offsetOf(parts[parts.length - 1], parts[parts.length - 1].length);
      const [a, b] = [first.closest('[data-l]'), last.closest('[data-l]')].map((x) => x && x.dataset.l.split('-'));
      const n = noteBox('hl:' + id, 'Góp ý cho đoạn này…');
      n.hl = { id, s, e, text: allText().slice(s, e), quote: quoteOf(parts), key:first.closest('[data-k]') ? first.closest('[data-k]').dataset.k : 'Mở đầu',
        lines: a && b ? 'dòng ' + (a[0] === b[1] ? a[0] : a[0] + '-' + b[1]) : '' };
      const marks = () => main.querySelectorAll('mark[data-c="' + id + '"]');
      const remove = () => {
        if (!notes.includes(n)) return;
        for (const m of marks()) { const p = m.parentNode; m.replaceWith(...m.childNodes); p.normalize(); }
        n.hl.box.remove();
        notes.splice(notes.indexOf(n), 1);
        update();
      };
      n.hl.box = el('div', { class: 'grid gap-1.5 border border-base-300 rounded-box bg-base-100 p-2 my-1.5', 'data-note': '', 'data-hl': id },
        el('div', { class: 'flex items-start gap-2' },
          el('span', { class: 'flex-1 min-w-0 text-[12.5px] text-muted wrap-anywhere', text: '«' + short(n.hl.quote) + '»' }),
          el('button', { type: 'button', class: btnCls('', true) + ' btn-ghost text-muted font-normal', onclick: remove }, 'Xóa')),
        n.box);
      // Under the bullet the passage ends in, else after its block (and after the comments already there).
      const li = last.closest('li');
      if (li) li.append(n.hl.box);
      else {
        let at = last.closest('#main > article > *');
        while (at.nextElementSibling && at.nextElementSibling.matches('[data-hl]')) at = at.nextElementSibling;
        at.after(n.hl.box);
      }
      // An empty comment goes away with its mark when it loses focus (not when the window does) or on Esc.
      n.ta.addEventListener('focus', () => { for (const m of marks()) m.dataset.active = 'true'; });
      n.ta.addEventListener('blur', () => {
        for (const m of marks()) delete m.dataset.active;
        setTimeout(() => { if (document.hasFocus() && document.activeElement !== n.ta && !n.ta.value.trim()) remove(); }, 0);
      });
      n.ta.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !n.ta.value.trim()) { ev.preventDefault(); remove(); } });
      if (text) { n.ta.value = text; n.strip.refresh(); fit(n.ta); }
      return n;
    };

    const finish = () => {
      if (review) main.prepend(el('p', { class: 'text-[13px] text-muted', text: 'Tô đen một đoạn rồi bấm Góp ý để góp ý ngay chỗ đó; ' + KEY_HINT + ' gửi tất cả.' }));
      if (ch.round > 1) {
        const link = (k) => (ids.has(k) ? el('a', { href: '#' + ids.get(k), class: 'link link-primary', text: k }) : el('span', { text: k }));
        const list = (label, keys) => (keys && keys.length ? el('p', {}, el('strong', { text: label + ' (' + keys.length + '): ' }), keys.flatMap((k, i) => [i ? ', ' : null, link(k)])) : null);
        const any = ['changed', 'added', 'removed'].some((k) => (ch[k] || []).length);
        main.prepend(el('div', { class: 'alert alert-soft alert-info block text-base-content text-[14px] leading-normal px-3 py-1.5 [&_strong]:text-[var(--color-info)]' },
          el('p', {}, el('strong', { text: 'Lần ' + ch.round + ': ' }), any ? 'các mục thay đổi so với bản bạn xem lần trước.' : 'không mục nào thay đổi so với lần trước.'),
          list('Đã sửa', ch.changed), list('Mới', ch.added), list('Đã bỏ', ch.removed)));
      }
      if (!review) return;
      const general = noteBox('Chung', 'Góp ý chung cho cả tài liệu…');
      main.append(el('article', { class: CARD, 'data-note': '' }, el('h2', { class: 'text-[18px] leading-[1.35] font-bold', text: 'Góp ý chung' }), general.box));
      const draft = store.get();
      let lost = 0;
      if (draft && draft.n) {
        for (const [k, v] of Object.entries(draft.img || {})) images.set(+k, v);
        for (const n of notes) if (draft.n[n.key]) { n.ta.value = draft.n[n.key]; n.box.hidden = false; n.strip.refresh(); fit(n.ta); }
        const all = allText();
        for (const h of draft.h || []) {
          const r = all.slice(h.s, h.e) === h.q ? rangeAt(h.s, h.e) : null;
          if (!r || !addComment(r, h.t)) lost++;
        }
      }
      update();
      if (lost) say('warn', 'Không khôi phục được ' + lost + ' góp ý tô đen (tài liệu đã đổi).');
      else if (draft) say('', 'Đã khôi phục góp ý đã lưu.');
    };

    if (review) {
      const noteLine = (n) => (n.hl ? '[§ ' + n.hl.key + (n.hl.lines ? ' · ' + n.hl.lines : '') + '] «' + short(n.hl.quote) + '» → ' : '[§ ' + n.key + '] ') + n.ta.value.trim();
      const text = (decision) => ['Quyết định: ' + decision, ...filled().map(noteLine),
        ...imgLines(filled().map((n) => n.ta.value).join('\n'))].join('\n');
      const approveBtn = el('button', { type: 'button', class: btnCls() + ' btn-success', onclick: () => deliver('Duyệt') }, sendMode ? 'Duyệt' : 'Copy: Duyệt');
      const changeBtn = el('button', { type: 'button', class: btnCls('primary'), onclick: () => deliver('Sửa') }, sendMode ? 'Gửi góp ý' : 'Copy góp ý', el('kbd', { class: 'kbd kbd-xs', text: KEY_HINT }));
      const deliver = async (decision) => {
        if (approveBtn.disabled) return;
        if (decision === 'Sửa' && !filled().length) {
          say('warn', 'Chưa có góp ý: tô đen một đoạn rồi bấm "Góp ý", bấm "Góp ý" ở mục cần sửa, hoặc ghi vào Góp ý chung cuối trang.');
          return;
        }
        const t = text(decision);
        if (sendMode) {
          approveBtn.disabled = changeBtn.disabled = true;
          try {
            await postText(t);
            store.set(null);
            say('ok', (decision === 'Duyệt' ? 'Đã gửi: Duyệt.' : 'Đã gửi ' + filled().length + ' góp ý cho Claude.') + ' Có thể đóng tab này.');
            return;
          } catch (e) { approveBtn.disabled = changeBtn.disabled = false; }
        }
        const copied = await copyText(t);
        say(copied && !sendMode ? 'ok' : 'warn', (sendMode ? 'Không gửi được (Claude không còn chờ trang này). ' : '')
          + (copied ? 'Đã copy: dán vào terminal của Claude.' : 'Không copy tự động được: chọn đoạn bên dưới, copy rồi dán vào terminal của Claude.'));
      };
      document.body.append(el('aside', { class: 'toast toast-end z-10 items-end', 'aria-label': 'Duyệt tài liệu' }, fabMsg, out,
        el('div', { class: 'flex items-center gap-1.5 bg-base-100 border border-base-300 rounded-box py-1 pr-1 pl-3 shadow-lg' }, count, approveBtn, changeBtn)));
      document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); deliver('Sửa'); } });

      // The Góp ý button by a selection; mousedown keeps the selection.
      const adder = el('button', { type: 'button', class: btnCls('primary', true) + ' fixed z-20 shadow-lg', hidden: true, onmousedown: (e) => e.preventDefault(), onclick: () => {
        const sel = getSelection();
        const n = sel.rangeCount ? addComment(sel.getRangeAt(0)) : null;
        adder.hidden = true;
        if (!n) return;
        sel.removeAllRanges();
        n.ta.focus();
      } }, 'Góp ý');
      document.body.append(adder);
      let placing = 0;
      const place = () => {
        const sel = getSelection();
        const r = sel.rangeCount && !sel.isCollapsed ? sel.getRangeAt(0) : null;
        adder.hidden = !r || !selectedTexts(r).length;
        if (adder.hidden) return;
        const rects = r.getClientRects();
        const b = rects.length ? rects[rects.length - 1] : r.getBoundingClientRect();
        adder.style.left = Math.max(8, Math.min(b.right + 4, innerWidth - adder.offsetWidth - 8)) + 'px';
        adder.style.top = Math.max(8, Math.min(b.bottom + 4, innerHeight - adder.offsetHeight - 8)) + 'px';
      };
      const later = () => { clearTimeout(placing); placing = setTimeout(place, 120); };
      document.addEventListener('selectionchange', later);
      addEventListener('scroll', later, { passive: true });
      main.addEventListener('click', (e) => {
        const m = e.target.closest('mark[data-c]');
        if (!m || String(getSelection()).trim()) return;
        const n = notes.find((x) => x.hl && x.hl.id === m.dataset.c);
        if (n) n.ta.focus();
      });
    }

    loadScript('https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js').then(() => render(window.marked)).catch(() => {
      main.append(el('article', { class: CARD },
        el('p', { class: CALLOUT, text: 'Không dựng được trang từ Markdown (mất mạng?); bên dưới là nội dung gốc.' }),
        el('pre', { class: 'm-0 whitespace-pre-wrap wrap-anywhere font-mono text-[12.5px]', text: doc.md })));
    }).then(finish);
  };

  if (D && D.doc) {
    docPage(D.doc);
    return;
  }
  if (!D || !D.questions || !D.questions.length) {
    main.append(el('article', { class: CARD }, el('p', { text: 'File này là mẫu, chưa có câu hỏi. Tạo trang câu hỏi bằng render-interview.mjs.' })));
    return;
  }

  const KEYS = 'ABCDEFGHIJ';
  const keyOf = (i) => KEYS[i] || String(i + 1);
  const OTHER = { id: 'other', label: 'Khác (tự nhập)', means: 'Không phương án nào ở trên đúng ý: gõ phương án của bạn.' };
  const EXPLAIN = { id: 'explain', label: 'Cần giải thích thêm', means: 'Claude giải thích rõ hơn rồi hỏi lại câu này. Ghi điều bạn chưa rõ vào ô ghi chú.' };
  const Q = D.questions;
  const nums = Q.map((q) => q.n);
  const range = nums.length > 1 ? 'Câu ' + Math.min(...nums) + '–' + Math.max(...nums) : 'Câu ' + (nums[0] ?? '');

  document.title = range + ' · ' + (D.topic || 'Phỏng vấn thiết kế');
  $('#topic').textContent = D.topic || 'Phỏng vấn thiết kế';
  const navLinks = Q.map((q) => el('a', { href: '#card-' + q.id, class: 'btn btn-xs btn-primary btn-outline font-mono font-medium' }));
  $('#qnav').append(...navLinks);

  // One card per question: what to read first, the answer strip last. The card's DOM is the answer state.
  const questionCard = (q) => {
    const multi = !!q.multi;
    const own = q.options || [];
    const options = [...own, OTHER, EXPLAIN];
    const state = el('span', { class: 'badge badge-sm ml-auto normal-case tracking-normal' });
    const inputs = [];
    const optCards = new Map();
    const otherBox = el('textarea', { id: q.id + '-other', rows: '1', hidden: true, class: TEXTAREA + ' flex-[1_1_18rem]', placeholder: 'Phương án của bạn…', 'aria-label': 'Phương án tự nhập' });
    const note = el('textarea', { id: q.id + '-note', rows: '1', class: TEXTAREA + ' flex-[1_1_18rem]', placeholder: 'Ghi chú (không bắt buộc): lý do, điều kiện kèm theo, hoặc điều bạn chưa rõ…', 'aria-label': 'Ghi chú cho câu ' + (q.n ?? '') });
    otherBox.addEventListener('input', () => fit(otherBox));
    note.addEventListener('input', () => fit(note));
    const strip = imageStrip([otherBox, note]);
    imageInput(otherBox, strip);
    imageInput(note, strip);

    // Option cards sit side by side and share rows (subgrid), so each part lines up across options.
    const parts = own.map((o, i) => [
      el('div', { class: 'flex flex-wrap items-baseline gap-x-2 gap-y-0.5' },
        el('span', { class: 'font-mono font-semibold text-primary', text: keyOf(i) + '.' }),
        el('span', { class: 'font-semibold' }, inline(o.label)),
        o.recommended ? el('span', { class: 'badge badge-xs badge-primary font-mono tracking-[.06em] uppercase', text: 'Đề xuất' }) : null,
        o.effort ? el('span', { class: 'ml-auto text-[12px] text-muted' }, 'Công sức: ', inline(o.effort)) : null),
      o.means ? el('p', {}, inline(o.means)) : null,
      o.mockup ? mockBlock(o.mockup) : null,
      o.code ? codeBlock(o.code) : null,
      o.example ? el('p', { class: 'text-[13px] bg-base-200 rounded-md px-2 py-1 whitespace-pre-line' }, el('strong', { text: 'Ví dụ: ' }), inline(o.example)) : null,
      (o.pros && o.pros.length) || (o.cons && o.cons.length) ? el('ul', { class: 'grid gap-px content-start text-[13px]' },
        (o.pros || []).map((p) => el('li', { class: PC + " before:content-['+'] before:text-[var(--color-success)]" }, inline(p))),
        (o.cons || []).map((c) => el('li', { class: PC + " before:content-['–'] before:text-[var(--color-error)]" }, inline(c)))) : null,
    ]);
    const used = [0, 1, 2, 3, 4, 5].filter((s) => parts.some((p) => p[s]));
    // A click on the card picks the option like its button in the answer strip, unless it lands on a control or ends a text selection.
    const optCard = (o, i) => {
      const box = el('div', { class: 'card border px-3 py-2.5 grid grid-rows-subgrid min-w-0 cursor-pointer transition-[border-color,background-color] duration-150 motion-reduce:transition-none hover:border-[var(--color-primary)] data-[chosen=true]:bg-tint data-[chosen=true]:border-[var(--color-primary)] data-[chosen=true]:[box-shadow:inset_0_0_0_1px_var(--color-primary)] '
        + (o.recommended ? 'border-primary' : 'border-base-300'), style: 'grid-row: span ' + used.length,
        onclick: (e) => {
          if (e.target.closest('a, button, input, textarea, iframe') || String(getSelection())) return;
          const input = inputs.find((x) => x.value === o.id);
          input.checked = multi ? !input.checked : true;
          input.dispatchEvent(new Event('change', { bubbles: true }));
        } },
        used.map((s) => parts[i][s] || el('div')));
      optCards.set(o.id, box);
      return box;
    };

    // Each choice is a daisyUI button that is itself the radio (or checkbox); its label is drawn from aria-label.
    const choice = (o, i) => {
      const builtin = o === OTHER || o === EXPLAIN;
      const input = el('input', { type: multi ? 'checkbox' : 'radio', name: 'choice-' + q.id, id: q.id + '-opt-' + o.id, value: o.id,
        'aria-label': (builtin ? '' : keyOf(i) + '. ') + plain(o.label) + (o.recommended ? ' ★' : ''),
        title: builtin ? o.means : o.recommended ? 'Claude đề xuất' : null,
        class: 'btn btn-sm font-medium checked:font-semibold' + (builtin ? ' btn-dash checked:bg-tint checked:text-[var(--color-primary)] checked:border-[var(--color-primary)]' : '') });
      inputs.push(input);
      input.addEventListener('change', () => {
        if (multi && input.checked) {
          for (const other of inputs) if (other !== input && (o === EXPLAIN || other.value === 'explain')) other.checked = false;
        }
        refresh();
        if (input.checked && o === OTHER) otherBox.focus();
        if (input.checked && o === EXPLAIN) note.focus();
      });
      return input;
    };

    const recI = own.findIndex((o) => o.recommended);
    const hasUndo = q.reversible != null;
    const undoText = q.reversible ? 'Dễ đổi về sau' : 'Khó đổi về sau';
    const card = el('article', { class: CARD, id: 'card-' + q.id },
      el('header', { class: 'grid gap-1' },
        el('div', { class: 'flex flex-wrap items-center gap-1.5 font-mono tracking-[.06em] uppercase' },
          el('span', { class: 'badge badge-sm badge-primary badge-outline', text: 'Câu ' + (q.n ?? '') }),
          q.stage ? el('span', { class: 'badge badge-sm badge-ghost text-muted', text: q.stage }) : null,
          hasUndo ? el('span', { class: 'badge badge-sm normal-case tracking-normal ' + (q.reversible ? 'badge-success badge-outline' : 'badge-warning badge-soft font-semibold'),
            title: q.reversibleWhy || null, text: undoText }) : null,
          state),
        el('h2', { class: 'text-[18px] leading-[1.35] font-bold text-balance' }, inline(q.title))),
      q.why || (hasUndo && q.reversibleWhy) ? el('div', { class: 'alert alert-soft alert-info block text-base-content text-[14px] leading-normal px-3 py-1.5 [&_strong]:text-[var(--color-info)]' },
        q.why ? el('p', {}, el('strong', { text: 'Vì sao cần chốt: ' }), inline(q.why)) : null,
        hasUndo && q.reversibleWhy ? el('p', {}, el('strong', { text: undoText + ': ' }), inline(q.reversibleWhy)) : null) : null,
      q.context && q.context.length ? el('div', { class: 'grid gap-2 min-w-0' }, q.context.map(block)) : null,
      own.length ? el('div', { class: 'grid gap-x-2 gap-y-1.5 grid-cols-[repeat(auto-fit,minmax(min(100%,15rem),1fr))]'
        + (own.length === 4 ? ' max-[1060px]:grid-cols-[repeat(auto-fit,minmax(min(100%,22rem),1fr))]' : '') }, own.map(optCard)) : null,
      q.recommendation ? el('p', { class: 'border-l-[3px] border-primary px-2.5 py-0.5' },
        el('strong', { class: 'text-primary' }, 'Claude đề xuất', recI >= 0 ? [' ' + keyOf(recI) + '. ', inline(own[recI].label)] : null, ': '),
        inline(q.recommendation)) : null,
      el('div', { class: 'border-t border-dashed border-base-300 pt-2.5 grid gap-2' },
        el('div', { class: 'flex items-baseline gap-2' },
          el('span', { class: 'font-mono text-[11px] font-medium tracking-[.06em] uppercase text-muted', text: 'Trả lời' }),
          el('span', { class: 'text-[12px] text-muted', text: multi ? 'chọn một hoặc nhiều' : 'chọn một' })),
        el('div', { class: 'flex flex-wrap gap-1.5' }, options.map(choice)),
        el('div', { class: 'flex flex-wrap gap-2' }, otherBox, note),
        strip));
    const otherInput = inputs[own.length];

    function refresh() {
      const done = inputs.some((i) => i.checked);
      state.textContent = done ? 'Đã chọn' : 'Chưa chọn';
      state.classList.toggle('badge-success', done);
      state.classList.toggle('badge-soft', done);
      state.classList.toggle('badge-ghost', !done);
      for (const i of inputs) if (optCards.has(i.value)) optCards.get(i.value).dataset.chosen = String(i.checked);
      otherBox.hidden = !otherInput.checked;
      strip.refresh();
      card.classList.remove('attention');
      updateFab();
    }

    const labelOf = (input) => {
      if (input.value === 'other') return 'Khác (tự nhập): ' + otherBox.value.trim();
      if (input.value === 'explain') return 'Cần giải thích thêm';
      const i = options.findIndex((o) => o.id === input.value);
      return keyOf(i) + '. ' + options[i].label;
    };

    refresh();
    return {
      q, card,
      rec: recI >= 0 ? own[recI].id : null,
      // null when complete, else what is missing.
      problem: () => {
        if (!inputs.some((i) => i.checked)) return 'chưa chọn phương án';
        if (otherInput.checked && !otherBox.value.trim()) return 'chọn "Khác" nhưng chưa gõ phương án';
        return null;
      },
      done: () => inputs.some((i) => i.checked),
      text: () => {
        const lines = ['[' + q.id + '] ' + q.title, 'Chọn: ' + inputs.filter((i) => i.checked).map(labelOf).join('; ')];
        if (note.value.trim()) lines.push('Ghi chú: ' + note.value.trim());
        lines.push(...imgLines((otherInput.checked ? otherBox.value : '') + '\n' + note.value));
        return lines.join('\n');
      },
      pick: (id) => {
        const input = inputs.find((i) => i.value === id);
        if (input) { input.checked = true; refresh(); }
      },
      get: () => ({ c: inputs.filter((i) => i.checked).map((i) => i.value), o: otherBox.value, n: note.value }),
      set: (s) => {
        for (const i of inputs) i.checked = !!s && (s.c || []).includes(i.value);
        otherBox.value = (s && s.o) || '';
        note.value = (s && s.n) || '';
        refresh();
        fit(otherBox);
        fit(note);
      },
    };
  };

  const fabCount = el('span', { class: 'font-mono text-[12px] text-muted whitespace-nowrap' });
  let cards = [];

  const store = storage('interview-draft:' + location.pathname);
  const save = () => store.set({ ...Object.fromEntries(cards.map((c) => [c.q.id, c.get()])), _img: Object.fromEntries(images) });

  const acceptBtn = el('button', { type: 'button', class: btnCls(), title: 'Chọn phương án Claude đề xuất cho các câu chưa chọn', onclick: () => {
    const todo = cards.filter((c) => !c.done() && c.rec);
    for (const c of todo) c.pick(c.rec);
    save();
    say('ok', 'Đã chọn theo đề xuất cho ' + todo.length + ' câu. Xem lại rồi ' + (sendMode ? 'gửi.' : 'copy.'));
  } }, 'Theo đề xuất');

  function updateFab() {
    fabCount.textContent = cards.filter((c) => c.done()).length + '/' + Q.length + ' câu';
    acceptBtn.hidden = !cards.some((c) => !c.done() && c.rec);
    cards.forEach((c, k) => {
      const done = c.done();
      navLinks[k].classList.toggle('btn-outline', !done);
      navLinks[k].textContent = 'Câu ' + (c.q.n ?? '') + (done ? ' ✓' : '');
    });
    say('');
  }

  if (D.decided && D.decided.length) {
    main.append(el('details', { class: 'collapse collapse-arrow bg-base-100 border border-base-300 text-[13px]' },
      el('summary', { class: 'collapse-title min-h-0 py-1.5 ps-3 font-semibold ' + FOCUS, text: 'Đã chốt trước đó (' + D.decided.length + ')' }),
      el('div', { class: 'collapse-content px-3 pb-2' }, el('ul', { class: 'm-0 pl-[2em] grid gap-0.5 list-disc' }, D.decided.map((d) => el('li', {}, inline(d)))))));
  }
  cards = Q.map(questionCard);
  for (const c of cards) main.append(c.card);
  main.addEventListener('input', save);
  main.addEventListener('change', save);

  // The answers of every card, or null after pointing at the first card that is not complete.
  const collect = () => {
    const missing = cards.find((c) => c.problem());
    if (missing) {
      missing.card.classList.add('attention');
      missing.card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      say('warn', 'Câu ' + (missing.q.n ?? '') + ' ' + missing.problem() + '.');
      return null;
    }
    return cards.map((c) => c.text()).join('\n\n');
  };
  const copyAll = async () => {
    const text = collect();
    if (text == null) return;
    if (await copyText(text)) {
      say('ok', 'Đã copy ' + cards.length + ' câu trả lời. Dán vào terminal của Claude rồi Enter.');
      setTimeout(() => { if (fabMsg.dataset.kind === 'ok') say(''); }, 4000);
    }
    else say('warn', 'Không copy tự động được: chọn đoạn bên dưới, copy rồi dán vào terminal của Claude.');
  };
  const sendBtn = el('button', { type: 'button', class: btnCls('primary'), onclick: () => sendAll() }, 'Gửi câu trả lời', el('kbd', { class: 'kbd kbd-xs', text: KEY_HINT }));
  const sendAll = async () => {
    const text = collect();
    if (text == null) return;
    sendBtn.disabled = true;
    try {
      await postText(text);
      store.set(null);
      sendBtn.textContent = 'Đã gửi';
      say('ok', 'Đã gửi cho Claude. Có thể đóng tab này.');
    } catch (e) {
      sendBtn.disabled = false;
      say('warn', await copyText(text)
        ? 'Không gửi được (Claude không còn chờ trang này). Đã copy câu trả lời: dán vào terminal của Claude.'
        : 'Không gửi được và không copy tự động được: chọn đoạn bên dưới, copy rồi dán vào terminal của Claude.');
    }
  };
  const submit = () => (sendMode ? (sendBtn.disabled ? null : sendAll()) : copyAll());

  document.body.append(el('aside', { class: 'toast toast-end z-10 items-end', 'aria-label': 'Gửi câu trả lời' }, fabMsg, out,
    el('div', { class: 'flex items-center gap-1.5 bg-base-100 border border-base-300 rounded-box py-1 pr-1 pl-3 shadow-lg' }, fabCount, acceptBtn,
      sendMode ? [el('button', { type: 'button', class: btnCls(), title: 'Copy để dán vào terminal', onclick: copyAll }, 'Copy'), sendBtn]
        : el('button', { type: 'button', class: btnCls('primary'), onclick: copyAll }, 'Copy câu trả lời', el('kbd', { class: 'kbd kbd-xs', text: KEY_HINT })))));
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); } });
  updateFab();

  const draft = store.get();
  if (draft && cards.some((c) => { const s = draft[c.q.id]; return s && ((s.c || []).length || s.o || s.n); })) {
    for (const [k, v] of Object.entries(draft._img || {})) images.set(+k, v);
    for (const c of cards) if (draft[c.q.id]) c.set(draft[c.q.id]);
    say('', 'Đã khôi phục câu trả lời đã lưu.', el('button', { type: 'button', class: btnCls('', true) + ' ml-2', onclick: () => {
      images.clear();
      for (const c of cards) c.set(null);
      store.set(null);
      say('');
    } }, 'Xóa nháp'));
  }
})();
</script>
</body>
</html>
