<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phỏng vấn thiết kế</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/* Layout: sticky bar with topic + progress; settled decisions fold at the top; one card per question with everything to read first (why, context, options side by side, recommendation) and a compact answer strip last; a small floating button copies every answer at once. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunken: #edf0f5;
  --ink: #172031;
  --muted: #5b6678;
  --line: #d8dee8;
  --accent: #2b4fbf;
  --accent-ink: #ffffff;
  --accent-soft: #e7ecfa;
  --pro: #1d7348;
  --con: #a93838;
  --note: #845400;
  --note-soft: #fbf2df;
  --mark: rgb(255 200 0 / .22);
  --shadow: 0 6px 20px rgb(23 32 49 / .18);
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e131b; --surface: #151c27; --sunken: #1b2330; --ink: #e5eaf2; --muted: #9ba7b9; --line: #2a3445;
    --accent: #93aaff; --accent-ink: #0e131b; --accent-soft: #1c2747; --pro: #74d3a0; --con: #f08d8d;
    --note: #e8bb5f; --note-soft: #2a2213; --mark: rgb(255 200 0 / .14); --shadow: 0 6px 20px rgb(0 0 0 / .5); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 56px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: calc(1280px + 32px); margin: 0 auto; padding-left: 16px; padding-right: 16px; }

.topbar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px; }
.topic { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 0; min-width: 0; }
.pill { font-family: var(--font-mono); font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.label { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

main.wrap { display: grid; gap: 14px; padding-block: 14px 80px; }
.decided { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
.decided > summary { cursor: pointer; padding: 6px 12px; font-weight: 600; }
.decided > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.decided ul { margin: 0; padding: 0 12px 8px 2em; display: grid; gap: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.card.attention { border-color: var(--note); box-shadow: 0 0 0 3px var(--note-soft); }
@media (max-width: 520px) { .card { padding: 14px 12px; } }
.card-head { display: grid; gap: 2px; }
.q-num { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.tag { color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.state { margin-left: auto; border-radius: 999px; padding: 0 8px; color: var(--muted); background: var(--sunken); text-transform: none; letter-spacing: 0; }
.state[data-done="true"] { color: var(--pro); }
.q-title { font-size: 18px; line-height: 1.35; font-weight: 700; margin: 0; text-wrap: balance; }
.why { margin: 0; background: var(--accent-soft); border-radius: 8px; padding: 6px 12px; }
.why strong { color: var(--accent); }

.blocks { display: grid; gap: 8px; min-width: 0; }
.blocks p { margin: 0; white-space: pre-line; max-width: 90ch; }
.blocks ul, .blocks ol { margin: 0; padding-left: 1.3em; display: grid; gap: 2px; max-width: 90ch; }
code { font-family: var(--font-mono); font-size: .86em; background: var(--sunken); border-radius: 4px; padding: .05em .3em; overflow-wrap: anywhere; }
figure.code { margin: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); min-width: 0; overflow: hidden; }
figure.code figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 3px 4px 3px 10px; border-bottom: 1px solid var(--line); }
figure.code figcaption span { min-width: 0; overflow-wrap: anywhere; }
.btn-file { font-family: var(--font-body); font-size: 12px; padding: 1px 10px; white-space: nowrap; color: var(--accent); background: var(--surface); border-color: var(--line); }
.code-body { display: flex; align-items: flex-start; overflow-x: auto; }
.code-body pre { margin: 0; padding: 8px 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 19px; tab-size: 2; }
.code-body .src { flex: 1 0 auto; }
.code-body code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.gutter { flex: none; position: sticky; left: 0; z-index: 1; text-align: right; color: var(--muted); background-color: var(--sunken); border-right: 1px solid var(--line); user-select: none; }
.marked { background-image: linear-gradient(var(--mark), var(--mark)); background-repeat: no-repeat; background-position: 0 var(--mt); background-size: 100% var(--mh); }
.viewer { width: min(1400px, calc(100vw - 32px)); height: calc(100vh - 48px); max-width: none; max-height: none; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); color: var(--ink); box-shadow: var(--shadow); overflow: hidden; }
.viewer[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.viewer::backdrop { background: rgb(0 0 0 / .45); }
.viewer-head { display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.viewer-path { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.viewer .code-body { overflow: auto; min-height: 0; }
.btn-ghost { background: var(--sunken); color: var(--ink); border-color: var(--line); }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 5px 10px; border-bottom: 1px solid var(--line); }
th { background: var(--sunken); font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }
.callout { background: var(--note-soft); border-radius: 8px; padding: 6px 12px; }
.callout strong:first-child { color: var(--note); }

.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 6px 8px; }
@media (max-width: 1060px) { .opts[data-n="4"] { grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); } }
.opt { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-rows: subgrid; min-width: 0; transition: border-color .15s, background-color .15s; }
.opt.recommended { border-color: var(--accent); }
.opt.chosen { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.opt-key { font-family: var(--font-mono); font-weight: 600; color: var(--accent); }
.opt-label { font-weight: 600; }
.badge-rec { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px; }
.effort { margin-left: auto; font-size: 12px; color: var(--muted); }
.opt p { margin: 0; }
.example { font-size: 13px; background: var(--sunken); border-radius: 6px; padding: 4px 8px; white-space: pre-line; }
.pc { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; align-content: start; font-size: 13px; }
.pc li { padding-left: 1.1em; text-indent: -1.1em; }
.pc li::before { display: inline-block; width: 1.1em; text-indent: 0; font-weight: 700; }
.pc .pro::before { content: "+"; color: var(--pro); }
.pc .con::before { content: "–"; color: var(--con); }
.rec { margin: 0; border-left: 3px solid var(--accent); padding: 2px 10px; }
.rec strong { color: var(--accent); }

.answer { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 8px; }
.answer-head { display: flex; align-items: baseline; gap: 8px; }
.hint { font-size: 12px; color: var(--muted); }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 8px; font-size: 13px; cursor: pointer; background: var(--surface); transition: border-color .15s, background-color .15s; }
.choice:hover { border-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice.builtin { border-style: dashed; }
.choice input { margin: 0; width: 15px; height: 15px; accent-color: var(--accent); }
.star { color: var(--accent); }
.fields { display: flex; flex-wrap: wrap; gap: 8px; }
.fields textarea { flex: 1 1 18rem; }
textarea { width: 100%; resize: vertical; font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.fab { position: fixed; right: 16px; bottom: 16px; z-index: 10; max-width: calc(100vw - 32px); display: grid; justify-items: end; gap: 6px; }
.fab-bar { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 12px; box-shadow: var(--shadow); }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
button { font: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 6px 14px; border: 1px solid transparent; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.msg { margin: 0; max-width: 22rem; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; box-shadow: var(--shadow); }
.msg:empty { display: none; }
.msg[data-kind="ok"] { color: var(--pro); }
.msg[data-kind="warn"] { color: var(--note); }
.out { width: min(26rem, calc(100vw - 32px)); font-family: var(--font-mono); font-size: 12px; max-height: 40vh; background: var(--sunken); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <h1 class="topic" id="topic">Phỏng vấn thiết kế</h1>
    <span class="pill" id="num"></span>
  </div>
</header>
<main class="wrap" id="main"></main>

<script>
(() => {
  const D = /*__INTERVIEW_DATA__*/null;
  const $ = (s, root = document) => root.querySelector(s);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
    return n;
  };

  // Inline `code` and **bold** only; everything else is plain text.
  const inline = (text) => {
    const frag = document.createDocumentFragment();
    String(text ?? '').split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach((part) => {
      if (!part) return;
      if (part.length > 2 && part[0] === '`' && part.endsWith('`')) frag.append(el('code', { text: part.slice(1, -1) }));
      else if (part.length > 4 && part.startsWith('**') && part.endsWith('**')) frag.append(el('strong', { text: part.slice(2, -2) }));
      else frag.append(document.createTextNode(part));
    });
    return frag;
  };

  // Code: highlight.js from the CDN (plain text when it did not load). Line numbers when the snippet came from a file.
  const LH = 19, PAD = 8;
  const AUTO = ['typescript', 'javascript', 'json', 'sql', 'bash', 'python', 'css', 'scss', 'xml', 'yaml'];
  const highlight = (text, lang) => {
    const h = window.hljs;
    if (!h) return null;
    try {
      if (lang && h.getLanguage(lang)) return h.highlight(text, { language: lang, ignoreIllegals: true }).value;
      const auto = h.highlightAuto(text, AUTO);
      return auto.relevance >= 5 ? auto.value : null;
    } catch (e) { return null; }
  };
  const codeView = (text, lang, start, mark) => {
    const code = el('code');
    const html = highlight(text, lang);
    if (html == null) code.textContent = text; else code.innerHTML = html;
    const style = mark ? '--mt:' + (PAD + (mark[0] - start) * LH) + 'px;--mh:' + (mark[1] - mark[0] + 1) * LH + 'px' : null;
    const marked = mark ? ' marked' : '';
    return el('div', { class: 'code-body' },
      start ? el('pre', { class: 'gutter' + marked, style, 'aria-hidden': 'true', text: Array.from({ length: text.split('\n').length }, (_, i) => start + i).join('\n') }) : null,
      el('pre', { class: 'src' + marked, style }, code));
  };

  const viewerPath = el('span', { class: 'viewer-path' });
  const viewerBody = el('div', { style: 'display:grid;min-height:0' });
  const viewer = el('dialog', { class: 'viewer', onclick: (e) => { if (e.target === viewer) viewer.close(); } },
    el('div', { class: 'viewer-head' }, viewerPath, el('button', { type: 'button', class: 'btn-ghost', onclick: () => viewer.close() }, 'Đóng (Esc)')),
    viewerBody);
  document.body.append(viewer);
  const openFile = (file, lang, mark) => {
    const text = D.files[file].replace(/\n$/, '');
    const view = codeView(text, lang, 1, mark);
    viewerPath.textContent = file + ' · ' + text.split('\n').length + ' dòng';
    viewerBody.replaceChildren(view);
    viewer.showModal();
    view.scrollTop = mark ? Math.max(0, PAD + (mark[0] - 5) * LH) : 0;
  };

  const codeBlock = (b) => {
    const lang = b.lang || (/\.([\w-]+)$/.exec(b.file || '') || [])[1];
    const full = b.file && D.files && D.files[b.file] != null;
    return el('figure', { class: 'code' },
      b.label || full ? el('figcaption', {}, el('span', { text: b.label || '' }),
        full ? el('button', { type: 'button', class: 'btn-file', onclick: () => openFile(b.file, lang, b.lines) }, 'Xem toàn file') : null) : null,
      codeView(b.text || '', lang, b.lines && b.lines[0], null));
  };

  const block = (b) => {
    switch (b && b.t) {
      case 'p': return el('p', {}, inline(b.text));
      case 'list': return el(b.ordered ? 'ol' : 'ul', {}, (b.items || []).map((i) => el('li', {}, inline(i))));
      case 'code': return codeBlock(b);
      case 'table': return el('div', { class: 'table-scroll' }, el('table', {},
        el('thead', {}, el('tr', {}, (b.head || []).map((h) => el('th', {}, inline(h))))),
        el('tbody', {}, (b.rows || []).map((r) => el('tr', {}, r.map((c) => el('td', {}, inline(c))))))));
      case 'note': return el('p', { class: 'callout' }, el('strong', { text: 'Lưu ý: ' }), inline(b.text));
      default: return b && b.text ? el('p', {}, inline(b.text)) : null;
    }
  };

  const main = $('#main');
  if (!D || !D.questions || !D.questions.length) {
    main.append(el('article', { class: 'card' }, el('p', { text: 'File này là mẫu, chưa có câu hỏi. Tạo trang câu hỏi bằng render-interview.mjs.' })));
    return;
  }

  const KEYS = 'ABCDEFGHIJ';
  const keyOf = (i) => KEYS[i] || String(i + 1);
  const OTHER = { id: 'other', label: 'Khác (tự nhập)', means: 'Không phương án nào ở trên đúng ý: gõ phương án của bạn.' };
  const EXPLAIN = { id: 'explain', label: 'Cần giải thích thêm', means: 'Claude giải thích rõ hơn rồi hỏi lại câu này. Ghi điều bạn chưa rõ vào ô ghi chú.' };
  const Q = D.questions;
  const nums = Q.map((q) => q.n);
  const range = nums.length > 1 ? 'Câu ' + Math.min(...nums) + '–' + Math.max(...nums) : 'Câu ' + (nums[0] ?? '');

  document.title = range + ' · ' + (D.topic || 'Phỏng vấn thiết kế');
  $('#topic').textContent = D.topic || 'Phỏng vấn thiết kế';
  $('#num').textContent = range;

  const grow = (ta) => ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; });

  // One card per question: what to read first, the answer strip last. The card's DOM is the answer state.
  const questionCard = (q) => {
    const multi = !!q.multi;
    const own = q.options || [];
    const options = [...own, OTHER, EXPLAIN];
    const state = el('span', { class: 'state' });
    const inputs = [];
    const optCards = new Map();
    const otherBox = el('textarea', { id: q.id + '-other', rows: '1', hidden: true, placeholder: 'Phương án của bạn…', 'aria-label': 'Phương án tự nhập' });
    const note = el('textarea', { id: q.id + '-note', rows: '1', placeholder: 'Ghi chú (không bắt buộc): lý do, điều kiện kèm theo, hoặc điều bạn chưa rõ…', 'aria-label': 'Ghi chú cho câu ' + (q.n ?? '') });
    grow(otherBox);
    grow(note);

    // Option cards sit side by side and share rows (subgrid), so each part lines up across options.
    const parts = own.map((o, i) => [
      el('div', { class: 'opt-head' },
        el('span', { class: 'opt-key', text: keyOf(i) + '.' }),
        el('span', { class: 'opt-label' }, inline(o.label)),
        o.recommended ? el('span', { class: 'badge-rec', text: 'Đề xuất' }) : null,
        o.effort ? el('span', { class: 'effort' }, 'Công sức: ', inline(o.effort)) : null),
      o.means ? el('p', {}, inline(o.means)) : null,
      o.example ? el('p', { class: 'example' }, el('strong', { text: 'Ví dụ: ' }), inline(o.example)) : null,
      (o.pros && o.pros.length) || (o.cons && o.cons.length) ? el('ul', { class: 'pc' },
        (o.pros || []).map((p) => el('li', { class: 'pro' }, inline(p))),
        (o.cons || []).map((c) => el('li', { class: 'con' }, inline(c)))) : null,
    ]);
    const used = [0, 1, 2, 3].filter((s) => parts.some((p) => p[s]));
    const optCard = (o, i) => {
      const box = el('div', { class: 'opt' + (o.recommended ? ' recommended' : ''), style: 'grid-row: span ' + used.length },
        used.map((s) => parts[i][s] || el('div')));
      optCards.set(o.id, box);
      return box;
    };

    const choice = (o, i) => {
      const builtin = o === OTHER || o === EXPLAIN;
      const input = el('input', { type: multi ? 'checkbox' : 'radio', name: 'choice-' + q.id, id: q.id + '-opt-' + o.id, value: o.id });
      inputs.push(input);
      input.addEventListener('change', () => {
        if (multi && input.checked) {
          for (const other of inputs) if (other !== input && (o === EXPLAIN || other.value === 'explain')) other.checked = false;
        }
        refresh();
        if (input.checked && o === OTHER) otherBox.focus();
        if (input.checked && o === EXPLAIN) note.focus();
      });
      return el('label', { class: 'choice' + (builtin ? ' builtin' : ''), for: input.id, title: builtin ? o.means : null }, input,
        builtin ? null : el('span', { class: 'opt-key', text: keyOf(i) + '.' }),
        el('span', {}, inline(o.label)),
        o.recommended ? el('span', { class: 'star', title: 'Claude đề xuất', text: '★' }) : null);
    };

    const recI = own.findIndex((o) => o.recommended);
    const card = el('article', { class: 'card', id: 'card-' + q.id },
      el('header', { class: 'card-head' },
        el('div', { class: 'q-num' }, el('span', { text: 'Câu ' + (q.n ?? '') }), q.stage ? el('span', { class: 'tag', text: q.stage }) : null, state),
        el('h2', { class: 'q-title' }, inline(q.title))),
      q.why ? el('p', { class: 'why' }, el('strong', { text: 'Vì sao cần chốt: ' }), inline(q.why)) : null,
      q.context && q.context.length ? el('div', { class: 'blocks' }, q.context.map(block)) : null,
      own.length ? el('div', { class: 'opts', 'data-n': String(own.length) }, own.map(optCard)) : null,
      q.recommendation ? el('p', { class: 'rec' },
        el('strong', {}, 'Claude đề xuất', recI >= 0 ? [' ' + keyOf(recI) + '. ', inline(own[recI].label)] : null, ': '),
        inline(q.recommendation)) : null,
      el('div', { class: 'answer' },
        el('div', { class: 'answer-head' }, el('span', { class: 'label', text: 'Trả lời' }), el('span', { class: 'hint', text: multi ? 'chọn một hoặc nhiều' : 'chọn một' })),
        el('div', { class: 'choices' }, options.map(choice)),
        el('div', { class: 'fields' }, otherBox, note)));
    const otherInput = inputs[own.length];

    function refresh() {
      const done = inputs.some((i) => i.checked);
      state.dataset.done = String(done);
      state.textContent = done ? 'Đã chọn' : 'Chưa chọn';
      for (const i of inputs) if (optCards.has(i.value)) optCards.get(i.value).classList.toggle('chosen', i.checked);
      otherBox.hidden = !otherInput.checked;
      card.classList.remove('attention');
      updateFab();
    }

    const labelOf = (input) => {
      if (input.value === 'other') return 'Khác (tự nhập): ' + otherBox.value.trim();
      if (input.value === 'explain') return 'Cần giải thích thêm';
      const i = options.findIndex((o) => o.id === input.value);
      return keyOf(i) + '. ' + options[i].label;
    };

    refresh();
    return {
      q, card,
      // null when complete, else what is missing.
      problem: () => {
        if (!inputs.some((i) => i.checked)) return 'chưa chọn phương án';
        if (otherInput.checked && !otherBox.value.trim()) return 'chọn "Khác" nhưng chưa gõ phương án';
        return null;
      },
      done: () => inputs.some((i) => i.checked),
      text: () => {
        const lines = ['[' + q.id + '] ' + q.title, 'Chọn: ' + inputs.filter((i) => i.checked).map(labelOf).join('; ')];
        if (note.value.trim()) lines.push('Ghi chú: ' + note.value.trim());
        return lines.join('\n');
      },
    };
  };

  const fabCount = el('span', { class: 'count' });
  const fabMsg = el('p', { class: 'msg', role: 'status' });
  const out = el('textarea', { id: 'out', class: 'out', readonly: true, hidden: true, 'aria-label': 'Câu trả lời để dán vào Claude' });
  const say = (kind, ...parts) => { fabMsg.dataset.kind = kind || ''; fabMsg.replaceChildren(...parts); };
  let cards = [];
  function updateFab() {
    fabCount.textContent = cards.filter((c) => c.done()).length + '/' + Q.length + ' câu';
    say('');
  }

  if (D.decided && D.decided.length) {
    main.append(el('details', { class: 'decided' }, el('summary', { text: 'Đã chốt trước đó (' + D.decided.length + ')' }),
      el('ul', {}, D.decided.map((d) => el('li', {}, inline(d))))));
  }
  cards = Q.map(questionCard);
  for (const c of cards) main.append(c.card);

  const copyAll = async () => {
    const missing = cards.find((c) => c.problem());
    if (missing) {
      missing.card.classList.add('attention');
      missing.card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      say('warn', 'Câu ' + (missing.q.n ?? '') + ' ' + missing.problem() + '.');
      return;
    }
    const text = cards.map((c) => c.text()).join('\n\n');
    out.value = text;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch (e) { out.hidden = false; out.focus(); out.select(); try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } }
    if (ok) {
      out.hidden = true;
      say('ok', 'Đã copy ' + cards.length + ' câu trả lời. Dán vào terminal của Claude rồi Enter.');
      setTimeout(() => { if (fabMsg.dataset.kind === 'ok') say(''); }, 4000);
    }
    else { out.hidden = false; say('warn', 'Không copy tự động được: chọn đoạn bên dưới, copy rồi dán vào terminal của Claude.'); }
  };

  document.body.append(el('aside', { class: 'fab', 'aria-label': 'Gửi câu trả lời' }, fabMsg, out,
    el('div', { class: 'fab-bar' }, fabCount, el('button', { type: 'button', class: 'btn-primary', title: 'Cmd/Ctrl+Enter', onclick: copyAll }, 'Copy câu trả lời'))));
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); copyAll(); } });
  updateFab();
})();
</script>
</body>
</html>
